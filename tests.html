<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Power-Law DCA Backtester — Correctness Checks</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f11;
    --panel: #17181b;
    --border: #2a2c30;
    --text: #e8e8e8;
    --muted: #9a9ba0;
    --orange: #f7931a;
    --green: #3ecf6e;
    --red: #ef5350;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
  #summary {
    font-family: var(--mono);
    font-size: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 1.25rem;
    display: inline-block;
  }
  #summary.pass { color: var(--green); border-color: var(--green); }
  #summary.fail { color: var(--red); border-color: var(--red); }
  ul { list-style: none; margin: 0; padding: 0; max-width: 900px; }
  li {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
  }
  li.pass { border-left: 4px solid var(--green); }
  li.fail { border-left: 4px solid var(--red); }
  .name { font-weight: 600; }
  .status { font-family: var(--mono); font-size: 0.8rem; margin-left: 0.5rem; }
  .status.pass { color: var(--green); }
  .status.fail { color: var(--red); }
  .detail { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); margin-top: 0.35rem; }
  a { color: var(--orange); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <h1>Correctness checks</h1>
  <p class="sub">Plain assertions against <code>js/powerlaw.js</code> and <code>js/backtest.js</code>. See <a href="README.md">README</a>. No test framework — see <code>js/tests-core.js</code> for the assertion logic.</p>
  <div id="summary">Running…</div>
  <ul id="results"></ul>

  <script src="js/data.js"></script>
  <script src="js/powerlaw.js"></script>
  <script src="js/backtest.js"></script>
  <script src="js/benchmarks.js"></script>
  <script src="js/rolling.js"></script>
  <script src="js/datacheck.js"></script>
  <script src="js/tests-core.js"></script>
  <script>
    const results = TestsCore.runAllTests();
    const list = document.getElementById("results");
    for (const r of results) {
      const li = document.createElement("li");
      li.className = r.pass ? "pass" : "fail";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = r.name;
      const status = document.createElement("span");
      status.className = "status " + (r.pass ? "pass" : "fail");
      status.textContent = r.pass ? "PASS" : "FAIL";
      li.appendChild(name);
      li.appendChild(status);
      if (!r.pass) {
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = r.message;
        li.appendChild(detail);
      }
      list.appendChild(li);
    }
    const failed = results.filter((r) => !r.pass).length;
    const summary = document.getElementById("summary");
    summary.textContent = failed === 0
      ? `All ${results.length} checks passed`
      : `${failed} of ${results.length} checks failed`;
    summary.className = failed === 0 ? "pass" : "fail";
  </script>
</body>
</html>
